name: Dependabot auto-merge
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.repository == 'ydkmlt84/Maintainerr' &&
        !github.event.pull_request.draft
      }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ github.token }}"

      - name: Determine auto-merge policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          eligible=false

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              eligible=true
              ;;
            version-update:semver-major)
              if [ "$PACKAGE_ECOSYSTEM" = "github-actions" ] || [ "$DEPENDENCY_TYPE" = "direct:development" ]; then
                eligible=true
              fi
              ;;
          esac

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}

      - name: Approve eligible update
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        run: |
          set -euo pipefail
          review_decision=$(gh pr view "$PR_URL" --json reviewDecision -q .reviewDecision)
          if [ "$review_decision" != "APPROVED" ]; then
            gh pr review --approve "$PR_URL"
          else
            echo "PR already approved."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

      - name: Enable auto-merge for eligible update
        if: ${{ steps.policy.outputs.eligible == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
