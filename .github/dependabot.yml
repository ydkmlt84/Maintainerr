version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 6
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      development-updates:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
      nestjs:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
          - "eslint-plugin-react*"
      typeorm:
        applies-to: version-updates
        patterns:
          - "typeorm"
          - "@nestjs/typeorm"
          - "better-sqlite3"
      non-major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "04:30"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      action-updates:
        applies-to: version-updates
        patterns:
          - "*"
